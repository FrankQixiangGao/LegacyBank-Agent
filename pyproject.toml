·[project]
name = "bankgpt"
version = "0.1.0"
description = "Computer-use automation: LLM discovery -> typed capability artifact -> deterministic replay"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cua = "cua.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cua", "mock_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
